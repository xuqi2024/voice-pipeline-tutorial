services:
  vad-service:
    build: .
    container_name: vad-service
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - VAD_THRESHOLD=0.5
      - MIN_SPEECH_MS=250
      - MIN_SILENCE_MS=300
      - MAX_SPEECH_MS=10000
      # funasr 和 voiceprint-api 通过共享网络访问
      - FUNASR_WS_URL=ws://funasr:10095
      - VOICEPRINT_API_URL=http://voiceprint-api:8005
      - VOICEPRINT_API_KEY=de395e06-035c-44f9-9a6b-8ef126a8bea0
      - DASHBOARD_URL=http://dashboard:8080
      - LLM_SERVICE_URL=http://llm-service:8006
      - PERSONA_AGENT_URL=http://persona-agent:8009
    networks:
      - voice-pipeline
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8767),timeout=3); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  # 外部共享网络：由 start-all.sh 创建
  # 所有服务（funasr, voiceprint-api, vad-service）都加入此网络
  voice-pipeline:
    external: true
    name: voice-pipeline
