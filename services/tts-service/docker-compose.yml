services:
  tts-service:
    build: .
    container_name: tts-service
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      - HOST=0.0.0.0
      - PORT=8766
      # 后端选择: edge（免费，默认）或 minimax（需账户余额）
      - TTS_BACKEND=edge
      # 默认音色（edge 后端用 zh-CN-*Neural，minimax 后端用 female-*/male-*）
      - DEFAULT_VOICE=zh-CN-XiaoxiaoNeural
      # MiniMax 配置（TTS_BACKEND=minimax 时生效）
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=https://api.minimaxi.com
      - MINIMAX_MODEL=speech-01
      # t2a_pro: 按次计费 | t2a_v2: 流式（需升级计划）
      - MINIMAX_ENDPOINT=t2a_pro
      - DEFAULT_SAMPLE_RATE=32000
    networks:
      - voice-pipeline
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  voice-pipeline:
    external: true
    name: voice-pipeline
