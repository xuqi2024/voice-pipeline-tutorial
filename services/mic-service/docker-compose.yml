services:
  mic-service:
    build: .
    container_name: mic-service
    restart: unless-stopped
    # 传入主机音频设备（以 root 运行，绕过 audio 组限制）
    devices:
      - /dev/snd:/dev/snd
    ports:
      - "8001:8001"
    environment:
      - VAD_WS_URL=ws://vad-service:8765?device=PC-Mic
      - MIC_KEYWORD=UGREEN
      - MIC_DEBUG=true
      - MIC_HTTP_PORT=8001
    networks:
      - voice-pipeline

networks:
  voice-pipeline:
    external: true
    name: voice-pipeline
