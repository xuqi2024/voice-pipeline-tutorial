services:
  mic-service:
    build: .
    container_name: mic-service
    restart: unless-stopped
    # 传入主机音频设备（以 root 运行，绕过 audio 组限制）
    devices:
      - /dev/snd:/dev/snd
    environment:
      - VAD_WS_URL=ws://vad-service:8765
      # Auto-discover UGREEN Camera by name (index differs inside Docker vs host)
      # Set MIC_KEYWORD to override the search keyword
      - MIC_KEYWORD=UGREEN
      - MIC_DEBUG=true
    networks:
      - voice-pipeline

networks:
  voice-pipeline:
    external: true
    name: voice-pipeline
