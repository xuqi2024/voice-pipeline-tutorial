<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙️ Voice Pipeline Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --blue: #58a6ff; --purple: #bc8cff; --orange: #ffa657;
    --cyan: #39d353;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* ── Header ── */
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--blue); }
  .conn-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background .3s; }
  .conn-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ── Layout ── */
  .main { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; gap: 0; height: calc(100vh - 49px); }

  /* ── Pipeline sidebar ── */
  .sidebar { grid-row: 1 / 3; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg2); }
  .sidebar section { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

  /* Pipeline flow */
  .pipeline { display: flex; flex-direction: column; gap: 0; }
  .pipe-node { display: flex; align-items: flex-start; gap: 10px; position: relative; }
  .pipe-node + .pipe-node::before { content: ''; position: absolute; left: 19px; top: -18px; width: 2px; height: 18px; background: var(--border); }
  .pipe-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid var(--border); background: var(--bg3); flex-shrink: 0; transition: all .3s; }
  .pipe-icon.active { border-color: var(--green); box-shadow: 0 0 10px rgba(63,185,80,.4); }
  .pipe-icon.processing { border-color: var(--yellow); box-shadow: 0 0 10px rgba(210,153,34,.4); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .pipe-info { flex: 1; padding-top: 4px; }
  .pipe-name { font-weight: 600; font-size: 13px; }
  .pipe-status { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .pipe-status.ok { color: var(--green); }
  .pipe-status.err { color: var(--red); }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--bg3); border-radius: 8px; padding: 10px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--blue); line-height: 1; }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* ── Event log ── */
  .log-panel { display: flex; flex-direction: column; overflow: hidden; }
  .log-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg2); }
  .log-header h2 { font-size: 13px; font-weight: 600; }
  .log-controls { display: flex; gap: 8px; }
  .btn-sm { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 12px; }
  .btn-sm:hover { background: var(--border); }
  .log-body { flex: 1; overflow-y: auto; padding: 8px 0; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; }
  .log-row { display: grid; grid-template-columns: 70px 80px 1fr; gap: 8px; padding: 3px 16px; align-items: start; }
  .log-row:hover { background: rgba(255,255,255,.03); }
  .log-time { color: var(--muted); }
  .log-tag { border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 600; text-align: center; white-space: nowrap; }
  .tag-vad { background: rgba(88,166,255,.15); color: var(--blue); }
  .tag-asr { background: rgba(63,185,80,.15); color: var(--green); }
  .tag-vp { background: rgba(188,140,255,.15); color: var(--purple); }
  .tag-sys { background: rgba(139,148,158,.15); color: var(--muted); }
  .tag-reg { background: rgba(255,166,87,.15); color: var(--orange); }
  .log-text { word-break: break-all; }
  .log-text .highlight { color: var(--yellow); font-weight: 600; }
  .log-text .speaker { color: var(--purple); font-weight: 600; }
  .log-text .asr-text { color: var(--green); }

  /* ── Register panel ── */
  .register-panel { border-top: 1px solid var(--border); background: var(--bg2); }
  .register-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .register-header h2 { font-size: 13px; font-weight: 600; }
  .register-body { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], select { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; width: 100%; }
  input[type=text]:focus, select:focus { border-color: var(--blue); }

  .record-btn { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; }
  .record-btn:hover { border-color: var(--blue); }
  .record-btn.recording { border-color: var(--red); background: rgba(248,81,73,.1); animation: pulse 1s infinite; }
  .record-btn.done { border-color: var(--green); background: rgba(63,185,80,.1); }

  .upload-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--blue); background: rgba(88,166,255,.05); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .submit-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--blue); color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; grid-column: span 2; }
  .submit-btn:hover:not(:disabled) { background: #79b8ff; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  .reg-result { grid-column: span 2; padding: 8px 12px; border-radius: 6px; font-size: 12px; display: none; }
  .reg-result.ok { background: rgba(63,185,80,.15); color: var(--green); display: block; }
  .reg-result.err { background: rgba(248,81,73,.15); color: var(--red); display: block; }

  /* ── Speaker count badge ── */
  .spk-count { background: var(--bg3); border-radius: 12px; padding: 2px 8px; font-size: 11px; color: var(--muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>🎙️ Voice Pipeline <span>Dashboard</span></h1>
  <div class="conn-badge">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">连接中...</span>
  </div>
</header>

<div class="main">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <section>
      <h2>管道状态</h2>
      <div class="pipeline" style="gap:18px">
        <div class="pipe-node">
          <div class="pipe-icon" id="node-mic">🎤</div>
          <div class="pipe-info">
            <div class="pipe-name">麦克风</div>
            <div class="pipe-status" id="st-mic">等待音频...</div>
          </div>
        </div>
        <div class="pipe-node">
          <div class="pipe-icon" id="node-vad">📡</div>
          <div class="pipe-info">
            <div class="pipe-name">Silero VAD</div>
            <div class="pipe-status" id="st-vad">待机</div>
          </div>
        </div>
        <div class="pipe-node">
          <div class="pipe-icon" id="node-asr">📝</div>
          <div class="pipe-info">
            <div class="pipe-name">FunASR</div>
            <div class="pipe-status" id="st-asr">待机</div>
          </div>
        </div>
        <div class="pipe-node">
          <div class="pipe-icon" id="node-vp">👤</div>
          <div class="pipe-info">
            <div class="pipe-name">声纹识别</div>
            <div class="pipe-status" id="st-vp">待机</div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>统计</h2>
      <div class="stat-grid">
        <div class="stat"><div class="stat-val" id="statDetected">0</div><div class="stat-lbl">检测次数</div></div>
        <div class="stat"><div class="stat-val" id="statRecognized">0</div><div class="stat-lbl">识别成功</div></div>
        <div class="stat"><div class="stat-val" id="statSpeakers">—</div><div class="stat-lbl">已注册说话人</div></div>
        <div class="stat"><div class="stat-val" id="statIdentified">0</div><div class="stat-lbl">身份匹配</div></div>
      </div>
    </section>

    <section>
      <h2>最近识别 <span class="spk-count" id="spkBadge">—</span></h2>
      <div id="lastResult" style="font-size:13px;line-height:1.6;color:var(--muted)">—</div>
    </section>
  </aside>

  <!-- ── Event Log ── -->
  <div class="log-panel">
    <div class="log-header">
      <h2>实时事件流</h2>
      <div class="log-controls">
        <button class="btn-sm" onclick="togglePause()" id="pauseBtn">⏸ 暂停</button>
        <button class="btn-sm" onclick="clearLog()">🗑 清空</button>
      </div>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>

  <!-- ── Register Panel ── -->
  <div class="register-panel">
    <div class="register-header" onclick="toggleRegister()">
      <h2>🔑 声纹注册</h2>
      <span id="toggleArrow">▲</span>
    </div>
    <div class="register-body" id="registerBody">
      <div class="form-group">
        <label>说话人 ID / 姓名</label>
        <input type="text" id="speakerId" placeholder="例：张三" />
      </div>

      <div class="form-group">
        <label>音频来源</label>
        <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
          <span id="recordIcon">🎙️</span>
          <span id="recordLabel">点击开始录音（5秒）</span>
        </button>
      </div>

      <div class="form-group" style="grid-column:span 2">
        <label>上传 WAV 文件 <span style="color:var(--muted);font-size:10px">（或拖拽到此处）</span></label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept=".wav,audio/wav" onchange="onFileSelect(this)" />
          <div id="uploadHint">📁 点击选择或拖拽 WAV 文件</div>
          <div class="hint" id="fileInfo"></div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="doRegister()" disabled>注册声纹</button>
      <div class="reg-result" id="regResult"></div>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let ws = null, paused = false;
let stats = { detected: 0, recognized: 0, identified: 0 };
let recordedBlob = null, selectedFile = null;
let isRecording = false;
let mediaStream = null, audioCtx = null, processor = null;
let recordChunks = [];
let recordTimer = null;

// ──────────────────────────────────────────────
// WebSocket
// ──────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setConn(true);
    addLog('sys', '✅ 已连接到 Dashboard');
    fetchHealth();
  };
  ws.onclose = () => {
    setConn(false);
    addLog('sys', '⚠️ 连接断开，3秒后重连...');
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };

  // heartbeat
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 20000);
}

function setConn(ok) {
  document.getElementById('connDot').className = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('connLabel').textContent = ok ? '已连接' : '断开';
}

// ──────────────────────────────────────────────
// Event Handler
// ──────────────────────────────────────────────
function handleEvent(ev) {
  const t = ev.type;

  if (t === 'speech_start') {
    stats.detected++;
    document.getElementById('statDetected').textContent = stats.detected;
    setNode('mic', 'active'); setNode('vad', 'processing');
    setSt('mic', '🎤 检测到语音', 'ok');
    setSt('vad', `prob=${ev.prob?.toFixed(2)}`, 'ok');
    addLog('vad', `▶ 语音开始 <span class="highlight">prob=${ev.prob?.toFixed(2)}</span>`);

  } else if (t === 'speech_end') {
    setNode('vad', 'active'); setNode('asr', 'processing'); setNode('vp', 'processing');
    setSt('vad', `${ev.duration_ms?.toFixed(0)}ms`, 'ok');
    setSt('asr', '识别中...', '');
    setSt('vp', '识别中...', '');
    addLog('vad', `■ 语音结束 <span class="highlight">${ev.duration_ms?.toFixed(0)}ms</span>`);

  } else if (t === 'asr_result') {
    stats.recognized++;
    document.getElementById('statRecognized').textContent = stats.recognized;
    setNode('asr', 'active');
    setSt('asr', ev.text || '（空）', 'ok');
    addLog('asr', `📝 <span class="asr-text">${esc(ev.text)}</span>`);

  } else if (t === 'voiceprint_result') {
    setNode('vp', 'active');
    if (ev.speaker) {
      stats.identified++;
      document.getElementById('statIdentified').textContent = stats.identified;
      setSt('vp', `${ev.speaker} (${ev.score?.toFixed(2)})`, 'ok');
      addLog('vp', `👤 说话人：<span class="speaker">${esc(ev.speaker)}</span> 分数：<span class="highlight">${ev.score?.toFixed(3)}</span>`);
    } else {
      setSt('vp', '未识别', '');
      addLog('vp', '👤 未匹配已注册说话人');
    }

  } else if (t === 'result') {
    // final combined result
    const spk = ev.speaker ? `<span class="speaker">${esc(ev.speaker)}</span>` : '<span style="color:var(--muted)">未知</span>';
    const txt = ev.text ? `<span class="asr-text">${esc(ev.text)}</span>` : '<span style="color:var(--muted)">（无文本）</span>';
    document.getElementById('lastResult').innerHTML = `${spk}<br>${txt}`;
    // reset nodes after delay
    setTimeout(() => {
      ['mic','vad','asr','vp'].forEach(n => setNode(n, ''));
    }, 3000);

  } else if (t === 'speaker_registered') {
    addLog('reg', `✅ 声纹注册：<span class="speaker">${esc(ev.speaker_id)}</span>`);
    fetchHealth();
  } else if (t === 'speaker_deleted') {
    addLog('reg', `🗑 声纹删除：<span class="speaker">${esc(ev.speaker_id)}</span>`);
    fetchHealth();
  }
}

// ──────────────────────────────────────────────
// Log
// ──────────────────────────────────────────────
function addLog(tag, html) {
  if (paused) return;
  const lb = document.getElementById('logBody');
  const row = document.createElement('div');
  row.className = 'log-row';
  const now = new Date();
  const ts = now.toTimeString().slice(0,8);
  const tagMap = { vad:'tag-vad', asr:'tag-asr', vp:'tag-vp', sys:'tag-sys', reg:'tag-reg' };
  const tagLabel = { vad:'VAD', asr:'ASR', vp:'声纹', sys:'系统', reg:'注册' };
  row.innerHTML = `<span class="log-time">${ts}</span><span class="log-tag ${tagMap[tag]||'tag-sys'}">${tagLabel[tag]||tag}</span><span class="log-text">${html}</span>`;
  lb.appendChild(row);
  lb.scrollTop = lb.scrollHeight;
  // keep max 500 rows
  while (lb.children.length > 500) lb.removeChild(lb.firstChild);
}

function clearLog() { document.getElementById('logBody').innerHTML = ''; }
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}

// ──────────────────────────────────────────────
// Pipeline nodes
// ──────────────────────────────────────────────
function setNode(name, state) {
  const el = document.getElementById('node-' + name);
  if (el) el.className = 'pipe-icon' + (state ? ' ' + state : '');
}
function setSt(name, text, cls) {
  const el = document.getElementById('st-' + name);
  if (el) { el.textContent = text; el.className = 'pipe-status' + (cls ? ' ' + cls : ''); }
}

// ──────────────────────────────────────────────
// Health
// ──────────────────────────────────────────────
async function fetchHealth() {
  try {
    const r = await fetch('/api/speakers/health');
    const d = await r.json();
    const n = d.total_voiceprints ?? '?';
    document.getElementById('statSpeakers').textContent = n;
    document.getElementById('spkBadge').textContent = `${n} 人`;
  } catch {}
}

// ──────────────────────────────────────────────
// Recording
// ──────────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) return stopRecord();

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
  } catch (e) {
    addLog('sys', `⚠️ 无法访问麦克风: ${e.message}`);
    return;
  }

  isRecording = true;
  recordChunks = [];
  const btn = document.getElementById('recordBtn');
  btn.className = 'record-btn recording';
  document.getElementById('recordIcon').textContent = '⏹';

  // Use AudioContext to get PCM
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(mediaStream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    recordChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  src.connect(processor);
  processor.connect(audioCtx.destination);

  let secs = 5;
  document.getElementById('recordLabel').textContent = `录音中... ${secs}秒`;
  recordTimer = setInterval(() => {
    secs--;
    document.getElementById('recordLabel').textContent = secs > 0 ? `录音中... ${secs}秒` : '处理中...';
    if (secs <= 0) stopRecord();
  }, 1000);
}

function stopRecord() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recordTimer);

  processor.disconnect();
  mediaStream.getTracks().forEach(t => t.stop());
  audioCtx.close();

  // Merge float32 arrays → int16 WAV
  const total = recordChunks.reduce((s, c) => s + c.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const c of recordChunks) { merged.set(c, offset); offset += c.length; }

  const int16 = new Int16Array(merged.length);
  for (let i = 0; i < merged.length; i++) int16[i] = Math.max(-32768, Math.min(32767, merged[i] * 32768));

  const wav = buildWav(int16.buffer, 16000);
  recordedBlob = new Blob([wav], { type: 'audio/wav' });
  selectedFile = null;

  document.getElementById('recordBtn').className = 'record-btn done';
  document.getElementById('recordIcon').textContent = '✅';
  document.getElementById('recordLabel').textContent = `录音完成 (${(total/16000).toFixed(1)}秒)`;
  document.getElementById('fileInfo').textContent = `录音文件: ${(wav.byteLength/1024).toFixed(1)} KB`;
  checkSubmit();
}

function buildWav(pcmBuffer, sampleRate) {
  const dataLen = pcmBuffer.byteLength;
  const buf = new ArrayBuffer(44 + dataLen);
  const v = new DataView(buf);
  const w = (off, str) => { for (let i=0;i<str.length;i++) v.setUint8(off+i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + dataLen, true);
  w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, dataLen, true);
  new Uint8Array(buf, 44).set(new Uint8Array(pcmBuffer));
  return buf;
}

// ──────────────────────────────────────────────
// File upload
// ──────────────────────────────────────────────
function onFileSelect(input) {
  const f = input.files[0];
  if (!f) return;
  selectedFile = f;
  recordedBlob = null;
  document.getElementById('uploadHint').textContent = `📁 ${f.name}`;
  document.getElementById('fileInfo').textContent = `${(f.size/1024).toFixed(1)} KB`;
  // reset record btn
  document.getElementById('recordBtn').className = 'record-btn';
  document.getElementById('recordIcon').textContent = '🎙️';
  document.getElementById('recordLabel').textContent = '点击开始录音（5秒）';
  checkSubmit();
}

// Drag & drop
const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) { selectedFile = f; document.getElementById('uploadHint').textContent = `📁 ${f.name}`; document.getElementById('fileInfo').textContent = `${(f.size/1024).toFixed(1)} KB`; recordedBlob = null; checkSubmit(); }
});

function checkSubmit() {
  const hasAudio = recordedBlob || selectedFile;
  const hasId = document.getElementById('speakerId').value.trim();
  document.getElementById('submitBtn').disabled = !(hasAudio && hasId);
}
document.getElementById('speakerId').addEventListener('input', checkSubmit);

// ──────────────────────────────────────────────
// Register
// ──────────────────────────────────────────────
async function doRegister() {
  const speakerId = document.getElementById('speakerId').value.trim();
  if (!speakerId) return;
  const audio = recordedBlob || (selectedFile ? selectedFile : null);
  if (!audio) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '注册中...';

  const fd = new FormData();
  fd.append('speaker_id', speakerId);
  fd.append('file', audio, 'audio.wav');

  try {
    const resp = await fetch('/api/speakers/register', { method: 'POST', body: fd });
    const data = await resp.json();
    const resultEl = document.getElementById('regResult');
    if (resp.ok && data.success) {
      resultEl.className = 'reg-result ok';
      resultEl.textContent = `✅ ${data.msg}`;
      document.getElementById('speakerId').value = '';
      recordedBlob = null; selectedFile = null;
      document.getElementById('uploadHint').textContent = '📁 点击选择或拖拽 WAV 文件';
      document.getElementById('fileInfo').textContent = '';
      document.getElementById('recordBtn').className = 'record-btn';
      document.getElementById('recordIcon').textContent = '🎙️';
      document.getElementById('recordLabel').textContent = '点击开始录音（5秒）';
    } else {
      resultEl.className = 'reg-result err';
      resultEl.textContent = `❌ ${data.detail || data.msg || '注册失败'}`;
    }
    setTimeout(() => { resultEl.className = 'reg-result'; }, 5000);
  } catch (e) {
    document.getElementById('regResult').className = 'reg-result err';
    document.getElementById('regResult').textContent = `❌ 请求失败: ${e.message}`;
  }

  btn.disabled = false; btn.textContent = '注册声纹';
  checkSubmit();
}

// ──────────────────────────────────────────────
// UI helpers
// ──────────────────────────────────────────────
let registerOpen = true;
function toggleRegister() {
  registerOpen = !registerOpen;
  document.getElementById('registerBody').style.display = registerOpen ? '' : 'none';
  document.getElementById('toggleArrow').textContent = registerOpen ? '▲' : '▼';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ──────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────
connect();
fetchHealth();
setInterval(fetchHealth, 30000);
</script>
