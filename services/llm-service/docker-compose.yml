services:
  llm-service:
    build: .
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - MINIMAX_API_KEY=sk-cp-kmRiCzHePZYnDjeLCBP8SKK4bjSzHf15OoN2How3i2000w5z-FnU1UCa8mvUyic2-Ch2c06XNCjEC33R6yjecJ6MWF50urFbF7nicibv_jTn9qELY73REUY
      - MINIMAX_BASE_URL=https://api.minimaxi.com/anthropic/v1/messages
      - MINIMAX_MODEL=MiniMax-M2.7
      - DASHBOARD_URL=http://dashboard:8080
      - TTS_SERVICE_URL=http://172.18.0.1:8766
      - TTS_VOICE_ID=zh-CN-XiaoxiaoNeural
      - VAD_SERVICE_URL=http://vad-service:8767
      - HOST_IP=192.168.1.8
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/api/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - voice-pipeline

networks:
  voice-pipeline:
    external: true
    name: voice-pipeline
